  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="mist" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
