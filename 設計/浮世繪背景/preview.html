<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #d8cdb4; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  .row { display: flex; gap: 36px; padding: 36px 36px 20px; }
  .col { width: 405px; }
  .name { font: 700 26px "Noto Serif TC", "PMingLiU", serif; color: #2A2522; margin: 0 0 14px 4px; }
  .phone { width: 405px; height: 900px; border-radius: 36px; overflow: hidden; position: relative;
           background-size: cover; border: 6px solid #2A2522; box-sizing: border-box; }
  .ui { position: absolute; inset: 0; padding: 40px 20px 0; }
  .date { font-size: 13px; color: #5E5245; }
  .title { font: 700 32px "Noto Serif TC", "PMingLiU", serif; color: #2A2522; margin: 2px 0 14px; }
  .card { background: rgba(248,242,228,.88); border: 1.5px solid #2A2522; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .rec { display: flex; align-items: center; gap: 14px; }
  .dot { width: 54px; height: 54px; border-radius: 50%; background: #C8402B; border: 2px solid #2A2522; display: grid; place-items: center; }
  .dot i { width: 18px; height: 18px; border-radius: 50%; background: #F8F2E4; }
  .t1 { font: 700 18px "Noto Serif TC", serif; color: #2A2522; }
  .t2 { font-size: 12px; color: #5E5245; margin-top: 2px; }
  .seg { display: flex; background: #E6D8B8; border-radius: 8px; padding: 3px; margin-top: 12px; font-size: 13px; }
  .seg span { flex: 1; text-align: center; padding: 7px 0; color: #5E5245; }
  .seg .on { background: #1E3A6E; border-radius: 6px; color: #F8F2E4; font-weight: 600; }
  .label { font-size: 13px; color: #2A2522; margin: 16px 2px 8px; display: flex; justify-content: space-between; font-weight: 600; }
  .item { display: flex; gap: 12px; }
  .time { font-size: 13px; color: #5E5245; width: 40px; }
  .kcal { color: #C8402B; font-size: 12px; }
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: rgba(240,228,200,.93);
         border-top: 1.5px solid #2A2522; display: flex; align-items: center; justify-content: space-around; font-size: 11px; color: #5E5245; }
  .nav b { width: 46px; height: 46px; border-radius: 50%; background: #1E3A6E; border: 2px solid #2A2522; }
  .nav .sel { color: #C8402B; font-weight: 700; }
  .note { font-size: 14px; color: #3D342C; margin: 12px 4px 0; line-height: 1.6; }
  .pal { display: flex; gap: 8px; margin: 0 36px 30px; align-items: center; color: #2A2522; font-size: 14px; flex-wrap: wrap; }
  .pal i { width: 30px; height: 30px; border-radius: 6px; border: 1.5px solid #2A2522; display: inline-block; }
</style></head><body>
<div class="row" id="row"></div>
<div class="pal">配色：<i style="background:#F0E4C8"></i>和紙底 <i style="background:#F8F2E4"></i>卡片 <i style="background:#2A2522"></i>墨字 <i style="background:#1E3A6E"></i>普魯士藍
  <i style="background:#C8402B"></i>朱紅 <i style="background:#E8B98F"></i>桃色 <i style="background:#C99A3C"></i>土黃 <i style="background:#2F5E4C"></i>松綠</div>
<script>
const all = [
  ["1_浪", "浪", "層層捲浪、白色浪爪與流紋，朱紅的日，桃色霞。"],
  ["2_峰", "峰", "積雪的山（上淺下深的藍）、山腳松林，朱紅的日。"],
  ["3_櫻", "櫻", "右上一枝櫻花、飄落花瓣，粉色與桃色霞，下方遠山水紋。"],
  ["4_藝伎武士", "藝伎武士", "朱紅拱橋上，撐紙傘的藝伎與佩雙刀的武士，柳枝垂下。"],
  ["5_靈鶴", "靈鶴", "三隻丹頂鶴、朱紅的日、桃色與淡藍霞，左下松枝。"],
  ["6_大阪城", "大阪城", "白牆、銅綠屋頂、金飾的五層天守，石垣、護城河、櫻花。"],
];
const items = new URLSearchParams(location.search).get("set") === "b" ? all.slice(3) : all.slice(0, 3);
const row = document.getElementById("row");
for (const [file, name, note] of items) {
  row.insertAdjacentHTML("beforeend", `
  <div class="col">
    <div class="name">${name}</div>
    <div class="phone" style="background-image:url('${file}.png')">
      <div class="ui">
        <div class="date">11 月 26 日 星期四</div>
        <div class="title">今天</div>
        <div class="card">
          <div class="rec"><div class="dot"><i></i></div><div><div class="t1">開始錄音</div><div class="t2">會議、課堂、訪談、靈感</div></div></div>
          <div class="seg"><span class="on">國語</span><span>台語・國台語</span><span>客語</span></div>
        </div>
        <div class="label"><span>今天的記錄</span><span>1,240 / 2000 大卡</span></div>
        <div class="card item"><div class="time">12:30</div><div><div class="t1" style="font-size:15px">午餐：牛肉麵＋燙青菜</div><div class="t2">約 780 大卡 <span class="kcal">· 食藥署 3 樣</span></div></div></div>
        <div class="card item"><div class="time">10:00</div><div><div class="t1" style="font-size:15px">專案週會</div><div class="t2">3 個待辦 · 下週二前交初稿</div></div></div>
      </div>
      <div class="nav"><span class="sel">今天</span><span>資料庫</span><b></b><span>飲食</span><span>設定</span></div>
    </div>
    <div class="note">${note}</div>
  </div>`);
}
</script>
</body></html>
